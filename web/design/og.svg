<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Source of public/og.png: rsvg-convert -w 1200 design/og.svg -o public/og.png -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f7fc"/>
      <stop offset="1" stop-color="#eceefb"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.1" r="0.7">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#4338ca"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#1e1b4b" flood-opacity="0.16"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <g transform="translate(72 64)">
    <rect width="56" height="56" rx="14" fill="url(#mark)"/>
    <path d="M16.6 17.1c0-2 2.2-3.2 3.9-2.2l15 8.9c1.8 1 1.8 3.6 0 4.6l-15 8.9c-1.7 1-3.9-.2-3.9-2.2z" fill="#fff"/>
    <circle cx="41.6" cy="40.7" r="5.7" fill="#34d399"/>
    <text x="74" y="39" font-family="Inter" font-size="32" font-weight="600" fill="#1c1d2e" letter-spacing="-0.6">ClipPay</text>
  </g>

  <g font-family="Inter" fill="#1c1d2e">
    <text x="72" y="238" font-size="64" font-weight="600" letter-spacing="-2">Pay creators for</text>
    <text x="72" y="314" font-size="64" font-weight="600" letter-spacing="-2">views that <tspan fill="#4f46e5">actually</tspan></text>
    <text x="72" y="390" font-size="64" font-weight="600" letter-spacing="-2" fill="#4f46e5">happen.</text>
    <text x="72" y="458" font-size="25" fill="#5b5f78">Budgets locked in a Stellar smart contract,</text>
    <text x="72" y="492" font-size="25" fill="#5b5f78">paid out per verified view — in minutes.</text>
  </g>
  <g transform="translate(72 540)" font-family="Inter" font-size="18" font-weight="600">
    <rect width="104" height="34" rx="17" fill="#fdf3d8" stroke="#e9cf8a"/>
    <text x="52" y="23" text-anchor="middle" fill="#8a5a00" letter-spacing="1.5">TESTNET</text>
    <text x="124" y="23" font-weight="500" fill="#5b5f78">Open source · Every payout on-chain</text>
  </g>

  <!-- Product card -->
  <g transform="translate(724 150)" font-family="Inter">
    <rect width="404" height="330" rx="22" fill="#fff" stroke="#e3e5f0" filter="url(#shadow)"/>
    <rect x="28" y="28" width="40" height="40" rx="11" fill="#fff4e6"/>
    <path d="M48 36l8 12-8 12-8-12z" fill="#f08a24"/>
    <text x="80" y="55" font-size="19" font-weight="500" fill="#1c1d2e">Kitebase</text>
    <rect x="306" y="34" width="70" height="28" rx="14" fill="#e3f6ea"/>
    <circle cx="324" cy="48" r="4" fill="#1f8a4c"/>
    <text x="336" y="54" font-size="15" font-weight="600" fill="#1f8a4c">Live</text>
    <text x="28" y="112" font-size="22" font-weight="600" fill="#1c1d2e">60-second app walkthrough</text>
    <rect x="28" y="128" width="134" height="28" rx="7" fill="#f1f2f8"/>
    <text x="95" y="148" font-size="14" text-anchor="middle" fill="#3a3d52">YouTube Shorts</text>
    <rect x="170" y="128" width="56" height="28" rx="7" fill="#f1f2f8"/>
    <text x="198" y="148" font-size="14" text-anchor="middle" fill="#3a3d52">Apps</text>
    <text x="28" y="212" font-size="40" font-weight="600" fill="#178a6c" letter-spacing="-1">1.20</text>
    <text x="118" y="210" font-size="18" fill="#5b5f78">XLM per 1k views</text>
    <text x="28" y="240" font-size="17" fill="#5b5f78">Earn up to 30 XLM</text>
    <rect x="28" y="268" width="348" height="8" rx="4" fill="#eceef5"/>
    <rect x="28" y="268" width="140" height="8" rx="4" fill="#4f46e5"/>
    <text x="28" y="304" font-size="14" fill="#5b5f78">40% of budget left</text>
    <text x="376" y="304" font-size="14" text-anchor="end" fill="#5b5f78">3 creators · 1d 20h left</text>
  </g>
  <!-- Payout toast -->
  <g transform="translate(664 470)" font-family="Inter">
    <rect width="330" height="76" rx="18" fill="#fff" stroke="#e3e5f0" filter="url(#shadow)"/>
    <circle cx="40" cy="38" r="18" fill="#3f7fd0"/>
    <text x="40" y="44" font-size="14" font-weight="600" text-anchor="middle" fill="#fff">JP</text>
    <text x="70" y="33" font-size="17" font-weight="500" fill="#1c1d2e">Jun Park</text>
    <text x="70" y="55" font-size="14" fill="#5b5f78">41.8K views</text>
    <text x="306" y="44" font-size="19" font-weight="600" text-anchor="end" fill="#178a6c">+0.05 XLM</text>
  </g>
</svg>
