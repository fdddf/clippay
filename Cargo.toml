[workspace]
resolver = "2"
members = ["contracts/*"]

[workspace.dependencies]
# OpenZeppelin Stellar Contracts 0.8.0 targets soroban-sdk 28 (contracts built
# with it run fine on protocol 29 networks).
soroban-sdk = "28.0.0"
stellar-access = "0.8.0"
stellar-contract-utils = "0.8.0"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
